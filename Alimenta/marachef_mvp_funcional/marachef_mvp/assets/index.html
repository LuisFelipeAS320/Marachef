<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MaraChef</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Newsreader:wght@400;500;600&amp;family=Outfit:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/marachef.css">
  <script src="/assets/receitas.js" defer></script>
  <script src="/assets/marachef.js" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7M5 9v11h5v-6h4v6h5V9"/></symbol>
    <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 6C9 4 5 4 2 5v14c3-1 7-1 10 1 3-2 7-2 10-1V5c-3-1-7-1-10 1Zm0 0v14M5 9h4m-4 4h4m6-4h4m-4 4h4"/></symbol>
    <symbol id="icon-video" viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/></symbol>
    <symbol id="icon-list" viewBox="0 0 24 24"><path d="M9 5h12M9 12h12M9 19h12M3 4l1-1v4M3 10h2l-2 4h2M3 17h2l-1 2h1l-1 2H3"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m12 2 3 2 4 1 1 4 2 3-2 3-1 4-4 1-3 2-3-2-4-1-1-4-2-3 2-3 1-4 4-1Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H4l1-4a8 8 0 1 1 15-4Z"/><path d="M8 10h8m-8 4h5"/></symbol>
    <symbol id="icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 20v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2Z"/></symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M7 19a4 4 0 1 1-.7-7.9 6 6 0 0 1 11.7 1A3.5 3.5 0 0 1 17.5 19H7Zm5 0v-8m-3 3 3-3 3 3"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5Zm9 0v6h5M8 13h8m-8 4h8"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4Z"/></symbol>
  </svg>
  <aside class="sidebar" id="sidebar" hidden>
    <a class="brand" href="/inicio"><span></span>MaraChef</a>
    <nav id="nav" aria-label="Navegação principal" hidden>
      <p class="nav-caption">Navegação</p>
      <a href="/inicio"><svg class="icon" aria-hidden="true"><use href="#icon-home"/></svg>Início</a>
      <a href="/biblioteca"><svg class="icon" aria-hidden="true"><use href="#icon-book"/></svg>Biblioteca de Receitas</a>
      <a href="/registro"><svg class="icon" aria-hidden="true"><use href="#icon-video"/></svg>Registrar Preparo</a>
      <a href="/revisao" data-review><svg class="icon" aria-hidden="true"><use href="#icon-check"/></svg>Validações</a>
    </nav>
    <div id="account" hidden>
      <span class="account-icon"><svg class="icon" aria-hidden="true"><use href="#icon-user"/></svg></span>
      <div><strong id="account-name"></strong><small id="account-role"></small></div>
      <button id="logout" class="secondary">Sair</button>
    </div>
  </aside>
  <div class="workspace">
    <header class="site-header">
      <a class="brand login-brand" href="/inicio"><span></span>MaraChef</a>
      <p class="eyebrow" id="panel-title" hidden>Painel do Chef</p>
      <span class="header-context">Cozinha Marambaia</span>
    </header>
    <main id="main" aria-busy="true"><p>Carregando MaraChef…</p></main>
  </div>
  <noscript>Ative o JavaScript para usar a MaraChef.</noscript>
</body>
</html>
